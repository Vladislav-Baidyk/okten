<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Fonts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Fjalla+One&family=Indie+Flower&family=Rubik+Pixels&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet"><style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            margin: 0;
        }

        .grid-container {
            display: grid;
            justify-content: center;
            align-items: center;
            gap: 15px;
            max-width: 1200px;
        }

        .card {
            background-color: #d1dbbd;
            border-radius: 12px;
            padding: 20px 15px;
            min-width: 160px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .first{font-family: "Rubik Pixels", system-ui;}
        .second{font-family: "Sedgwick Ave Display", cursive;}
        .third{font-family: "Dancing Script", cursive;}
        .fourth{font-family: "Fjalla One", sans-serif;}
        .fifth{font-family: "Indie Flower", cursive;}
    </style>
</head>
<body>

<div class="grid-container">
    <div class="card first">Rubik Pixels</div>
    <div class="card second">SedGwich ave Display</div>
    <div class="card third">Dancing Script</div>
    <div class="card fourth">Fjalla One</div>
    <div class="card fifth">Indie Flower</div>
 </div> 

</body>
</html>
