<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Домашнє завдання</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: #ffe4c4;
            height: 300px;
            width: 100%;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: all 0.3s ease;
        }

        .box:hover {
            background-color: gray;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
</html>
