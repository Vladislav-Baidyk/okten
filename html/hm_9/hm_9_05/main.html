<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
        <style>
            body {
                width: 1728px;
                height: 1117px;
                margin: 0;
                padding: 0;
            }

            .container {
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-rows: 4.476% 73.68% 9.94% 11.91%;
            }

            .strip:nth-child(1) {
                background-color: #D9D9D9;
            }

            /* В даній структурі mid-container є другим елементом сітки */
            .mid-container {
                display: grid;
                grid-template-columns: 59.375% 40.625%;
            }

            .left-part {
                background-color: #A4A4A4;
            }

            .right-part {
                display: grid;
                grid-template-rows: 54.07% 45.93%;
            }

            .spam:nth-child(1) {
                background-color: #7F7A7A;
            }

            .spam:nth-child(2) {
                background-color: #615050;
            }

            /* Нижні смуги */
            .strip:nth-child(3) {
                background-color: #D9D9D9;
            }

            .strip:nth-child(4) {
                background-color: #D9D9D9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header class="strip"></header>
            <main class="mid-container">
                <section class="left-part"></section>
                <aside class="right-part">
                    <div class="spam"></div>
                    <div class="spam"></div>
                </aside>
            </main>
            <div class="strip"></div>
            <footer class="strip"></footer>
        </div>
    </body>
</html>
