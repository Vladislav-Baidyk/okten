<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
        <style>
            body {
                width: 1728px;
                height: 1117px;
                margin: 0;
                padding: 0;
            }

            .container {
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-rows: 21.84% 56.32% 21.84%;
            }

            .strip1 {
                background-color: #D9D9D9;
            }

            .mid-container {
                display: grid;
                grid-template-columns: 26.84% 46.32% 26.84%;
            }

            .mid-mid-container {
                display: grid;
                grid-template-rows: 1fr 1fr;
            }

            .mid-strip {
                background-color: #A4A4A4;
            }

            .mid-mid-strip:nth-child(even) {
                background-color: #827878;
            }

            .mid-mid-strip:nth-child(odd) {
                background-color: #B7ADAD;
            }

            .strip3 {
                background-color: #D9D9D9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header class="strip1"></header>
            <main class="mid-container">
                <div class="mid-strip"></div>
                <div class="mid-mid-container">
                    <div class="mid-mid-strip"></div>
                    <div class="mid-mid-strip"></div>
                </div>
                <div class="mid-strip"></div>
            </main>
            <footer class="strip3"></footer>
        </div>
    </body>
</html>
