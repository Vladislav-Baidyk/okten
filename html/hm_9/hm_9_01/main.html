<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
        <style>
            body {
                width: 1728px;
                height: 1117px;
                margin: 0;
                padding: 0;
            }

            .container {
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-rows: 21.84% 56.31% 21.85%;
            }

            .strip1 {
                background-color: #D9D9D9;
            }

            .strip2 {
                background-color: #A4A4A4;
            }

            .strip3 {
                background-color: #D9D9D9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="strip1"></div>
            <div class="strip2"></div>
            <div class="strip3"></div>
        </div>
    </body>
</html>
