<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
    </head>
    <style>
        body{
            width: 1728px;
            height: 1117px;
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header{
            height:  20%;
            width: 100%;
            background-color:#8D8484;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mid-container{
            display: flex;
            height: 60%;
        }
        .left-part{
            display: flex;
            flex-direction: column;
            width: 70.95%;
            height: 100%;
        }
        .content{
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content:nth-child(1){background-color: #776969;}
        .content:nth-child(2){background-color: #643030;}
        .content:nth-child(3){background-color: #441818;}
        .right-part{
            display: flex;
            flex-direction: column;
            width: 29.05%;
        }
        .spam{
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spam:nth-child(1){background-color: #937575;}
        .spam:nth-child(2){background-color: #644C4C;}
        .footer{
            height:  20%;
            width: 100%;
            background-color:#BDBDBD;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <body>
        <div class="container">
            <div class="header">Header</div>
            <div class="mid-container">
                <div class="left-part">
                    <div class="content">Content-1</div>
                    <div class="content">Content-2</div>
                    <div class="content">Content-3</div>
                </div>
                <div class="right-part">
                    <div class="spam">spam-1</div>
                    <div class="spam">spam-2</div>
                </div>
            </div>
            <div class="footer">footer</div>
        </div>
    </body>
</html>
