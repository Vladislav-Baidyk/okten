<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Ring Preloader</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
        }

        .loader {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .loader span {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-radius: 50%;
        }

        .loader .outer {
            border-top: 4px solid #00d2ff;
            border-right: 4px solid #00d2ff;
            animation: rotate 1.5s linear infinite;
        }

        .loader .inner {
            top: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
            border-bottom: 4px solid #9d00ff;
            border-left: 4px solid #9d00ff;
            animation: rotate-reverse 1s linear infinite;
            filter: blur(1px);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .text {
            position: absolute;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="loader">
        <span class="outer"></span>
        <span class="inner"></span>
        <div class="text">Loading</div>
    </div>
</body>
</html>
