
<!DOCTYPE html>
<html>
    <head>
<meta charset="UTF-8">
    <title>cards</title>
    </head>
    <style>
section {
        margin: 20px 0;
    }

    header {
        font-size: 22px;
        margin-bottom: 10px;
        color: #333;
    }

    kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #e0e0e0;
        border-radius: 2px;
        padding: 8px 12px;
        margin-right: 8px;
        font-size: 32px;
        min-width: 50px;
        border: none;
        font-family: inherit;
    }

    .red { color: #b30000; }
    .black { color: #000; }
    </style>
    <body>

<section>
    <header>Player 1:</header>
    <kbd class="black">2&clubs;</kbd>
    <kbd class="red">9&hearts;</kbd>
    <kbd class="red">6&hearts;</kbd>
    <kbd class="red">A&diams;</kbd>
    <kbd class="black">Q&spades;</kbd>
    <kbd class="black">J&clubs;</kbd>
</section>

<section>
    <header>Player 2:</header>
    <kbd class="red">3&hearts;</kbd>
    <kbd class="black">A&clubs;</kbd>
    <kbd class="black">10&clubs;</kbd>
    <kbd class="red">K&diams;</kbd>
    <kbd class="black">8&spades;</kbd>
    <kbd class="red">3&hearts;</kbd>
</section>
    </body>
</html>
