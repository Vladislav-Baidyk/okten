<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
    </head>
    <style>
        body{
            width: 1728px;
            height: 1117px;
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .strip1{
            height:  21.84%;
            width: 100%;
            background-color: #D9D9D9;
        }
        .mid-container{
            height: 56.31%;
            width: 100%;
            display: flex;
        }
        .mid-strip:nth-child(odd){
            background-color: #C0BDBD;
            width: 26.84%;
            height: 100%;
        }
        .mid-strip:nth-child(even){
            background-color: #A4A4A4;
            width: 46.32%;
            height: 100%;
        }
        .strip3{
            height:  21.84%;
            width: 100%;
            background-color: #D9D9D9;
        }
    </style>
    <body>
        <div class="container">
            <div class="strip1"></div>
            <div class="mid-container">
                <div class="mid-strip"></div>
                <div class="mid-strip"></div>
                <div class="mid-strip"></div>
            </div>
            <div class="strip3"></div>
        </div>
    </body>
</html>
