<!DOCTYPE html>
<html>
    <head>
        <title>MacBook 16</title>
    </head>
    <style>
        body{
            width: 1728px;
            height: 1117px;
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .strip:nth-child(1){
            width: 100%;
            height: 4.476%;
            background-color: #D9D9D9;
        }
        .strip:nth-child(2){
            height:  9.94%;
            width: 100%;
            background-color: #D9D9D9;
        }
        .strip:nth-child(3){
            height:  11.91%;
            width: 100%;
            background-color: #D9D9D9;
        }
        .mid-container{
            display: flex;
            width: 100%;
            height: 73.68%;
        }
        .left-part{
            height: 100%;
            width: 59.375%;
            background-color: #A4A4A4;
        }
        .right-part{
            height: 100%;
            width:40.625% ;
        }
        .spam{
            width: 100%;
        }
        .spam:nth-child(1){
            background-color:#7F7A7A;
            height: 54.07%; 
        }
        .spam:nth-child(2){
            background-color: #615050;
            height: 45.93%;
        }
    </style>
    <body>
        <div class="container">
            <div class="strip"></div>
            <div class="mid-container">
                <div class="left-part"></div>
                <div class="right-part">
                    <div class="spam"></div>
                    <div class="spam"></div>
                </div>
            </div>
            <div class="strip"></div>
            <div class="strip"></div>
        </div>
    </body>
</html>
